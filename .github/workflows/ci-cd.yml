name: BukuSaku CI/CD

# ─────────────────────────────────
# TRIGGER: run when push to main or week-6
# ─────────────────────────────────
on:
  push:
    branches: [main, week-6]
  pull_request:
    branches: [main]

# ─────────────────────────────────
# JOB 1: TEST
# ─────────────────────────────────
jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bukusaku_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bukusaku_test

      - name: Run database migrations
        working-directory: backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bukusaku_test

      - name: Run backend tests
        working-directory: backend
        run: npx jest --runInBand --verbose
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bukusaku_test
          NEXTAUTH_SECRET: test-secret-for-ci
          JWT_SECRET: test-secret-for-ci
          NODE_ENV: test

  # ─────────────────────────────────
  # JOB 2: BUILD
  # ─────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: test # ← only run when job test PASS

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: TypeScript check backend
        working-directory: backend
        run: |
          npm ci
          npx tsc --noEmit

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          NEXTAUTH_SECRET: test-secret-for-ci
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:5000/api
